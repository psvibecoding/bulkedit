<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f2f0ec"/>
  <!-- Top green accent -->
  <rect width="1200" height="5" fill="#1a5c38"/>

  <!-- Logo mark -->
  <rect x="72" y="64" width="44" height="44" rx="9" fill="#1a5c38"/>
  <text x="94" y="95" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-weight="700" font-size="20" fill="white">L</text>
  <text x="130" y="95" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="3">LEDERLY</text>

  <!-- Main headline -->
  <text x="72" y="205" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#0e0e0c">Your Shopify catalog.</text>
  <text x="72" y="270" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#0e0e0c">One table. Any field.</text>
  <text x="72" y="332" font-family="Georgia,serif" font-size="46" font-weight="700" font-style="italic" fill="#1a5c38">Prices revert themselves.</text>

  <!-- Subtitle -->
  <text x="72" y="380" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#6b7280">Edit, schedule and auto-revert — no CSVs, no exports.</text>

  <!-- Free beta pill -->
  <rect x="72" y="404" width="156" height="42" rx="21" fill="#1a5c38"/>
  <text x="150" y="431" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="white">Free beta →</text>

  <!-- Trust line -->
  <text x="72" y="590" font-family="system-ui,Arial,sans-serif" font-size="15" fill="#b4b4ac">lederly.com · No account · OAuth secured</text>

  <!-- Card 1: Scheduling -->
  <rect x="760" y="48" width="380" height="104" rx="14" fill="white"/>
  <rect x="760" y="64" width="4" height="72" fill="#1a5c38"/>
  <text x="782" y="88" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="600" fill="#0e0e0c">Scheduled: Summer Sale</text>
  <text x="782" y="110" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#6b7280">Jun 21 · 00:00 — auto-reverts Jun 24 · 09:00</text>
  <text x="782" y="132" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#9ca3af">156 products · Email notification on</text>

  <!-- Card 2: Bulk editing -->
  <rect x="760" y="168" width="380" height="104" rx="14" fill="white"/>
  <rect x="760" y="184" width="4" height="72" fill="#2563eb"/>
  <text x="782" y="208" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="600" fill="#0e0e0c">Bulk price edit — 200 products</text>
  <text x="782" y="230" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#6b7280">Rule: Decrease by 20% · Review before saving</text>
  <text x="782" y="252" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#9ca3af">Full diff shown — no surprises</text>

  <!-- Card 3: Metafields -->
  <rect x="760" y="288" width="380" height="104" rx="14" fill="white"/>
  <rect x="760" y="304" width="4" height="72" fill="#7c3aed"/>
  <text x="782" y="328" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="600" fill="#0e0e0c">Variant metafields · Tags · Status</text>
  <text x="782" y="350" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#6b7280">Edit any field across all variants at once</text>
  <text x="782" y="372" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#9ca3af">The gap Shopify still doesn't fill</text>

  <!-- Card 4: Beta highlight -->
  <rect x="760" y="408" width="380" height="104" rx="14" fill="#1a5c38"/>
  <text x="782" y="440" font-family="system-ui,Arial,sans-serif" font-size="10" font-weight="600" fill="white" fill-opacity="0.45" letter-spacing="2">FREE BETA</text>
  <text x="782" y="464" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="700" fill="white">All features unlocked</text>
  <text x="782" y="486" font-family="system-ui,Arial,sans-serif" font-size="11" fill="white" fill-opacity="0.65">Scheduling · Auto-revert · Metafields · No account</text>
</svg>
