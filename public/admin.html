<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lederly — Admin</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a5c38'/><text x='16' y='22' text-anchor='middle' fill='white' font-family='system-ui,sans-serif' font-size='16' font-weight='700'>L</text></svg>"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1a5c38;--green-lt:#1f7044;--green-bg:rgba(26,92,56,.07);
  --bg:#f5f5f3;--white:#fff;--ink:#0e0e0c;--ink2:#3c3c38;--ink3:#6b7280;
  --border:#e4e4de;--mono:'Geist Mono','Menlo',monospace;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{background:var(--green);color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.logo-mark{background:rgba(255,255,255,.2);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.hdr-right{font-size:12px;opacity:.7;font-family:var(--mono)}
main{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
h2{font-size:13px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.kpi-val{font-size:30px;font-weight:700;color:var(--ink);line-height:1;margin-bottom:4px}
.kpi-lbl{font-size:11px;color:var(--ink3);font-family:var(--mono);letter-spacing:.04em}
.kpi-sub{font-size:11px;color:var(--ink3);margin-top:4px}
.kpi-green .kpi-val{color:var(--green)}
.section{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:20px}
.funnel{display:flex;flex-direction:column;gap:6px}
.funnel-row{display:grid;grid-template-columns:160px 1fr 60px;align-items:center;gap:12px}
.funnel-lbl{font-size:12px;color:var(--ink2);font-weight:500}
.funnel-bar-wrap{height:10px;background:#f0f0ec;border-radius:5px;overflow:hidden}
.funnel-bar{height:100%;background:var(--green);border-radius:5px;transition:width .5s ease}
.funnel-n{font-size:12px;color:var(--ink3);text-align:right;font-family:var(--mono)}
.chart{display:flex;align-items:flex-end;gap:3px;height:80px;margin-top:8px}
.bar-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.bar-stack{display:flex;flex-direction:column-reverse;align-items:stretch;width:100%;border-radius:3px 3px 0 0;overflow:hidden}
.bar-seg{transition:height .4s}
.bar-label{font-size:8px;color:var(--ink3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center;transform:rotate(-45deg);transform-origin:top center;margin-top:4px;height:20px;line-height:20px}
.chart-legend{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3)}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.td-event{font-family:var(--mono);font-size:12px;color:var(--ink)}
.td-num{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink)}
.td-d7{color:var(--green);font-weight:600}
.badge{display:inline-block;background:var(--green-bg);color:var(--green);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:600;font-family:var(--mono)}
.refresh-note{font-size:11px;color:var(--ink3);text-align:right;margin-top:8px;font-family:var(--mono)}
.error{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:20px;color:#dc2626;font-size:14px}
.loading{color:var(--ink3);font-size:14px;padding:40px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-mark">L</div>
    Lederly Admin
  </div>
  <div class="hdr-right" id="hdr-ts">Loading…</div>
</header>

<main id="main"><div class="loading">Loading stats…</div></main>

<script>
const SECRET = new URLSearchParams(location.search).get('secret') || '';

const COLORS = {
  connect:         '#1a5c38',
  save:            '#2563eb',
  schedule_create: '#7c3aed',
  page_view:       '#d97706',
  cta_click:       '#db2777',
  demo_start:      '#0891b2',
  bulk_action:     '#059669',
  export_csv:      '#64748b',
  tour_complete:   '#4f46e5',
  tour_skip:       '#9ca3af',
};
function color(ev){ return COLORS[ev] || '#94a3b8'; }

function fmt(n){ return n==null?'—':Number(n).toLocaleString(); }

async function load(){
  const url = `/api/admin/stats${SECRET ? '?secret='+encodeURIComponent(SECRET) : ''}`;
  const r = await fetch(url);
  if (r.status === 401) throw new Error('Unauthorized — provide ?secret=PING_SECRET in URL');
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

function renderKPIs(d){
  const s = d.stores || {};
  const f = d.funnel || {};
  return `
  <div class="kpis">
    <div class="kpi kpi-green"><div class="kpi-val">${fmt(s.total)}</div><div class="kpi-lbl">Stores connected</div><div class="kpi-sub">all time</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(s.active7d)}</div><div class="kpi-lbl">Active stores</div><div class="kpi-sub">last 7 days</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(s.active30d)}</div><div class="kpi-lbl">Active stores</div><div class="kpi-sub">last 30 days</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(f.page_views_30d)}</div><div class="kpi-lbl">Page views</div><div class="kpi-sub">last 30 days</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(f.cta_clicks_30d)}</div><div class="kpi-lbl">CTA clicks</div><div class="kpi-sub">last 30 days</div></div>
    <div class="kpi"><div class="kpi-val">${d.uptime||'—'}</div><div class="kpi-lbl">Uptime</div><div class="kpi-sub">since last restart</div></div>
  </div>`;
}

function renderFunnel(f){
  if(!f) return '';
  const rows = [
    { lbl:'Page views (30d)', n: f.page_views_30d },
    { lbl:'CTA clicks (30d)', n: f.cta_clicks_30d },
    { lbl:'Demo started',     n: f.demoed },
    { lbl:'Store connected',  n: f.connected },
    { lbl:'Pushed to Shopify',n: f.saved },
    { lbl:'Scheduled',        n: f.scheduled },
  ].filter(r => r.n != null);
  const max = Math.max(...rows.map(r=>r.n||0), 1);
  return `<div class="section">
    <h2>Funnel (all time)</h2>
    <div class="funnel">
      ${rows.map(r=>`
      <div class="funnel-row">
        <div class="funnel-lbl">${r.lbl}</div>
        <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${Math.round((r.n||0)/max*100)}%"></div></div>
        <div class="funnel-n">${fmt(r.n)}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderChart(daily){
  if(!daily||!Object.keys(daily).length) return '';
  // Last 14 days
  const dates = [];
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setUTCDate(d.getUTCDate()-i);
    dates.push(d.toISOString().split('T')[0]);
  }
  const keyEvents = ['page_view','cta_click','connect','save','schedule_create','demo_start'];
  const allVals = dates.flatMap(d => keyEvents.map(ev => (daily[d]?.[ev]||0)));
  const maxVal = Math.max(...allVals, 1);
  const H = 70; // px

  const bars = dates.map(date => {
    const day = daily[date] || {};
    const segs = keyEvents.filter(ev => day[ev]).map(ev => {
      const h = Math.max(2, Math.round((day[ev]/maxVal)*H));
      return `<div class="bar-seg" style="height:${h}px;background:${color(ev)}" title="${ev}: ${day[ev]}"></div>`;
    }).join('');
    const lbl = date.slice(5); // MM-DD
    return `<div class="bar-day"><div class="bar-stack" style="height:${H}px">${segs}</div><div class="bar-label">${lbl}</div></div>`;
  }).join('');

  const legend = keyEvents.map(ev =>
    `<div class="legend-item"><div class="legend-dot" style="background:${color(ev)}"></div>${ev.replace(/_/g,' ')}</div>`
  ).join('');

  return `<div class="section">
    <h2>Last 14 days</h2>
    <div class="chart">${bars}</div>
    <div class="chart-legend">${legend}</div>
  </div>`;
}

function renderEvents(events){
  if(!events||!Object.keys(events).length) return '';
  const rows = Object.entries(events)
    .sort((a,b)=>b[1].total-a[1].total)
    .map(([ev,c])=>`
      <tr>
        <td class="td-event"><span class="legend-dot" style="display:inline-block;background:${color(ev)};width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:middle"></span>${ev}</td>
        <td class="td-num">${fmt(c.total)}</td>
        <td class="td-num td-d7">${fmt(c.d7)}</td>
        <td class="td-num">${fmt(c.d30)}</td>
      </tr>`).join('');
  return `<div class="section">
    <h2>Events breakdown</h2>
    <table>
      <thead><tr><th>Event</th><th style="text-align:right">Total</th><th style="text-align:right;color:var(--green)">Last 7d</th><th style="text-align:right">Last 30d</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

async function render(){
  const main = document.getElementById('main');
  try {
    const d = await load();
    document.getElementById('hdr-ts').textContent = 'Updated ' + new Date().toLocaleTimeString();
    main.innerHTML =
      renderKPIs(d) +
      renderFunnel(d.funnel) +
      renderChart(d.daily) +
      renderEvents(d.events) +
      `<p class="refresh-note">Mode: ${d.mode||'?'} · Auto-refresh every 60s</p>`;
  } catch(e) {
    main.innerHTML = `<div class="error">⚠ ${e.message}</div>`;
  }
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
