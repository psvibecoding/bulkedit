<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lederly — Admin</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a5c38'/><text x='16' y='22' text-anchor='middle' fill='white' font-family='system-ui,sans-serif' font-size='16' font-weight='700'>L</text></svg>"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1a5c38;--green-lt:#1f7044;--green-bg:rgba(26,92,56,.07);
  --bg:#f5f5f3;--white:#fff;--ink:#0e0e0c;--ink2:#3c3c38;--ink3:#6b7280;
  --border:#e4e4de;--mono:'Geist Mono','Menlo',monospace;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{background:var(--green);color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.logo-mark{background:rgba(255,255,255,.2);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.hdr-right{font-size:12px;opacity:.7;font-family:var(--mono)}
main{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
.section-label{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin:28px 0 12px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:6px}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.kpi-val{font-size:28px;font-weight:700;color:var(--ink);line-height:1;margin-bottom:3px;font-variant-numeric:tabular-nums}
.kpi-lbl{font-size:11px;color:var(--ink3);font-family:var(--mono);letter-spacing:.03em}
.kpi-sub{font-size:10px;color:var(--ink3);margin-top:3px;opacity:.7}
.kpi-green  .kpi-val{color:var(--green)}
.kpi-blue   .kpi-val{color:#2563eb}
.kpi-purple .kpi-val{color:#7c3aed}
.kpi-warn   .kpi-val{color:#d97706}
/* Sections */
.section{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin:0}
/* Controls */
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn-group{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.btn-group button{background:var(--white);border:none;border-right:1px solid var(--border);padding:5px 10px;font-size:11px;font-family:var(--mono);color:var(--ink3);cursor:pointer;transition:background .12s,color .12s}
.btn-group button:last-child{border-right:none}
.btn-group button.active{background:var(--green);color:#fff}
.btn-group button:hover:not(.active){background:var(--bg)}
/* Date range picker */
.date-range{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:7px;padding:4px 10px;background:var(--white)}
.date-range input{border:none;outline:none;font-size:11px;font-family:var(--mono);color:var(--ink2);background:transparent;width:96px;cursor:pointer}
.date-range span{font-size:11px;color:var(--ink3)}
.date-range.active{border-color:var(--green)}
/* Bar chart */
.chart-area{overflow:hidden}
.chart{display:flex;align-items:flex-end;gap:2px;height:160px;overflow:hidden}
.bar-day{flex:1;min-width:0}
.bar-stack{display:flex;flex-direction:column-reverse;width:100%;height:100%;border-radius:2px 2px 0 0;overflow:hidden}
.bar-seg{flex-shrink:0}
.bar-seg:hover{opacity:.75}
.chart-xlabels{display:flex;gap:2px;margin-top:4px}
.chart-xlabel{flex:1;font-size:8px;color:var(--ink3);font-family:var(--mono);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:clip;min-width:0}
/* Line chart */
.line-chart-wrap{height:180px}
.line-chart-wrap svg{width:100%;height:100%;overflow:visible}
/* Legend */
.chart-legend{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3);cursor:pointer;user-select:none;transition:opacity .15s}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
/* Funnel */
.funnel{display:flex;flex-direction:column;gap:7px}
.funnel-row{display:grid;grid-template-columns:170px 1fr 60px;align-items:center;gap:12px}
.funnel-lbl{font-size:12px;color:var(--ink2);font-weight:500}
.funnel-bar-wrap{height:8px;background:#f0f0ec;border-radius:4px;overflow:hidden}
.funnel-bar{height:100%;background:var(--green);border-radius:4px;transition:width .5s ease}
.funnel-n{font-size:12px;color:var(--ink3);text-align:right;font-family:var(--mono)}
/* Events table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;padding:7px 10px;border-bottom:1px solid var(--border)}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.td-event{font-family:var(--mono);font-size:12px}
.td-num{text-align:right;font-family:var(--mono);font-size:12px}
.td-d7{color:var(--green);font-weight:600}
/* Summary */
.summary{background:var(--green-bg);border:1px solid rgba(26,92,56,.15);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.summary-title{font-size:11px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.summary-body{font-size:13px;color:var(--ink2);line-height:1.7}
.summary-body strong{color:var(--ink);font-weight:600}
.summary-body .neutral{color:var(--ink3)}
.summary-body .good{color:#1a5c38;font-weight:600}
.summary-body .warn{color:#d97706;font-weight:600}
.summary-body .bad {color:#dc2626;font-weight:600}
/* Utils */
.error{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:20px;color:#dc2626;font-size:14px}
.loading{color:var(--ink3);font-size:14px;padding:40px;text-align:center}
.refresh-note{font-size:11px;color:var(--ink3);text-align:right;margin-top:12px;font-family:var(--mono)}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* ── Mobile ── */
@media(max-width:640px){
  header{padding:12px 16px}
  main{padding:16px 12px 60px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi{padding:12px 14px}
  .kpi-val{font-size:22px}
  .section{padding:14px 14px;margin-bottom:12px}
  .section-head{margin-bottom:12px}
  .controls{gap:6px}
  .btn-group button{padding:5px 8px;font-size:10px}
  .date-range{padding:4px 7px}
  .date-range input{width:80px;font-size:10px}
  .funnel-row{grid-template-columns:110px 1fr 48px;gap:8px}
  .funnel-lbl{font-size:11px}
  .summary-body{font-size:12px}
  .section-label{margin:20px 0 10px}
}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-mark">L</div>Lederly Admin</div>
  <div class="hdr-right" id="hdr-ts">Loading…</div>
</header>
<div style="background:#0d3d25;padding:10px 28px;display:flex;flex-direction:column;gap:8px">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span style="font-size:11px;color:rgba(255,255,255,.45);font-family:var(--mono);white-space:nowrap">Exclude shops:</span>
    <input id="exclude-input" placeholder="mystore.myshopify.com, store2.myshopify.com"
      style="flex:1;min-width:220px;max-width:420px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:5px 10px;font-size:12px;font-family:var(--mono);color:#fff;outline:none"
      onkeydown="if(event.key==='Enter') applyExclude()"/>
    <button onclick="applyExclude()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:5px 14px;font-size:12px;font-family:var(--mono);cursor:pointer;white-space:nowrap">
      Apply
    </button>
    <button onclick="resetAnalytics()" style="margin-left:auto;background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.35);color:#fca5a5;border-radius:6px;padding:5px 14px;font-size:12px;font-family:var(--mono);cursor:pointer;white-space:nowrap">
      Reset analytics
    </button>
  </div>
  <div id="exclude-chips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
</div>
<main id="main"><div class="loading">Loading stats…</div></main>

<script>
const SECRET = new URLSearchParams(location.search).get('secret') || '';

const COLORS = {
  connect:          '#1a5c38',
  app_open:         '#4ade80',
  save:             '#2563eb',
  save_attempt:     '#93c5fd',
  schedule_create:  '#7c3aed',
  schedule_run:     '#a78bfa',
  schedule_partial: '#f59e0b',
  schedule_fail:    '#ef4444',
  page_view:        '#d97706',
  cta_click:        '#db2777',
  demo_start:       '#0891b2',
  bulk_action:      '#059669',
  export_csv:       '#64748b',
  tour_complete:    '#4f46e5',
  tour_skip:        '#9ca3af',
  products_load:    '#ea580c',
  disconnect:       '#6b7280',
};
const KEY_EVENTS = ['page_view','cta_click','connect','app_open','save_attempt','save','bulk_action','schedule_create','schedule_run','schedule_fail'];

function color(ev){ return COLORS[ev] || '#94a3b8'; }
function fmt(n, dec){ if(n==null) return '—'; return dec!=null ? Number(n).toFixed(dec) : Number(n).toLocaleString(); }
function pct(n){ return n==null ? '—' : n+'%'; }

const state = {
  days: 14, chartType: 'bar', data: null,
  hiddenEvents: new Set(),
  customFrom: null, customTo: null,
};

function getExcludeList(){ return (localStorage.getItem('admin_exclude')||'').split(',').map(s=>s.trim()).filter(Boolean); }
function setExcludeList(arr){ localStorage.setItem('admin_exclude', arr.join(',')); }

function renderExcludeChips(){
  const list = getExcludeList();
  const wrap = document.getElementById('exclude-chips');
  if(!wrap) return;
  wrap.innerHTML = list.map(s =>
    `<span style="display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:2px 10px 2px 10px;font-size:11px;font-family:var(--mono);color:rgba(255,255,255,.75)">
      ${s}
      <button onclick="removeExclude('${s.replace(/'/g,"\\'")}')" style="background:none;border:none;color:rgba(255,255,255,.45);cursor:pointer;font-size:13px;line-height:1;padding:0;margin-left:2px" title="Remove">×</button>
    </span>`
  ).join('');
}

function applyExclude(){
  const raw = document.getElementById('exclude-input').value;
  const newShops = raw.split(',').map(s=>s.trim()).filter(Boolean);
  const existing = getExcludeList();
  const merged = [...new Set([...existing, ...newShops])];
  setExcludeList(merged);
  document.getElementById('exclude-input').value = '';
  renderExcludeChips();
  render();
}

function removeExclude(shop){
  setExcludeList(getExcludeList().filter(s=>s!==shop));
  renderExcludeChips();
  render();
}

async function load(){
  const params = new URLSearchParams();
  if(SECRET) params.set('secret', SECRET);
  const excl = getExcludeList().join(',');
  if(excl) params.set('exclude', excl);
  const url = `/api/admin/stats?${params}`;
  const r = await fetch(url);
  if(r.status===401) throw new Error('Unauthorized — provide ?secret=PING_SECRET in URL');
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

async function resetAnalytics(){
  if(!confirm('Reset ALL analytics events? This cannot be undone.')) return;
  const params = new URLSearchParams();
  if(SECRET) params.set('secret', SECRET);
  const r = await fetch(`/api/admin/reset-analytics?${params}`, { method: 'DELETE' });
  const d = await r.json();
  if(d.ok) { alert(`Deleted ${d.deleted} events. Refreshing…`); render(); }
  else alert('Error: ' + d.error);
}

function todayStr(){ return new Date().toISOString().split('T')[0]; }
function minDateStr(){
  const d = new Date(); d.setDate(d.getDate()-89);
  return d.toISOString().split('T')[0];
}

function getDates(){
  if(state.customFrom && state.customTo){
    const dates=[], cur=new Date(state.customFrom), end=new Date(state.customTo);
    while(cur<=end){ dates.push(cur.toISOString().split('T')[0]); cur.setDate(cur.getDate()+1); }
    return dates;
  }
  const dates=[];
  for(let i=state.days-1;i>=0;i--){
    const d=new Date(); d.setUTCDate(d.getUTCDate()-i);
    dates.push(d.toISOString().split('T')[0]);
  }
  return dates;
}

/* ── KPIs ── */
function renderKPIs(d){
  const s=d.stores||{}, f=d.funnel||{}, dp=d.deep||{};
  return `
  <div class="section-label">Overview · all time</div>
  <div class="kpis">
    <div class="kpi kpi-green"><div class="kpi-val">${fmt(s.total)}</div><div class="kpi-lbl">Stores connected</div></div>
    <div class="kpi kpi-blue"><div class="kpi-val">${fmt(d.waitlist_count)}</div><div class="kpi-lbl">Waitlist signups</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(s.active7d)}</div><div class="kpi-lbl">Active stores</div><div class="kpi-sub">last 7 days</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(s.active30d)}</div><div class="kpi-lbl">Active stores</div><div class="kpi-sub">last 30 days</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(f.page_views_30d)}</div><div class="kpi-lbl">Page views</div><div class="kpi-sub">last 30 days</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(f.cta_clicks_30d)}</div><div class="kpi-lbl">CTA clicks</div><div class="kpi-sub">last 30 days</div></div>
    <div class="kpi"><div class="kpi-val">${d.uptime||'—'}</div><div class="kpi-lbl">Uptime</div></div>
  </div>
  <div class="section-label">Product usage · all time</div>
  <div class="kpis">
    <div class="kpi kpi-blue"><div class="kpi-val">${fmt(dp.variants_saved)}</div><div class="kpi-lbl">Variants saved</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(dp.products_loaded)}</div><div class="kpi-lbl">Products loaded</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(dp.total_saves)}</div><div class="kpi-lbl">Save operations</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(dp.total_bulk_actions)}</div><div class="kpi-lbl">Bulk actions</div></div>
  </div>
  <div class="section-label">Averages &amp; conversion · all time</div>
  <div class="kpis">
    <div class="kpi kpi-purple"><div class="kpi-val">${pct(dp.activation_rate)}</div><div class="kpi-lbl">Activation rate</div><div class="kpi-sub">connected → saved</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(dp.avg_saves_per_store,1)}</div><div class="kpi-lbl">Avg saves / store</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(dp.avg_products_per_store)}</div><div class="kpi-lbl">Avg products / store</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(dp.avg_bulk_per_store,1)}</div><div class="kpi-lbl">Avg bulk / store</div></div>
    <div class="kpi ${dp.save_success_rate>=90?'kpi-green':dp.save_success_rate>=70?'':'kpi-warn'}">
      <div class="kpi-val">${dp.save_success_rate!=null?dp.save_success_rate+'%':'—'}</div>
      <div class="kpi-lbl">Save success rate</div><div class="kpi-sub">${fmt(dp.total_saves)} ok / ${fmt(dp.total_save_attempts)} attempts</div>
    </div>
    <div class="kpi ${dp.schedule_reliability>=95?'kpi-green':dp.schedule_reliability!=null&&dp.schedule_reliability<80?'kpi-warn':''}">
      <div class="kpi-val">${dp.schedule_reliability!=null?dp.schedule_reliability+'%':'—'}</div>
      <div class="kpi-lbl">Schedule reliability</div><div class="kpi-sub">${fmt(dp.schedule_runs_ok)} ok · ${fmt(dp.schedule_runs_fail)} fail</div>
    </div>
    <div class="kpi"><div class="kpi-val">${fmt(dp.app_opens)}</div><div class="kpi-lbl">Return sessions</div><div class="kpi-sub">app opens (no re-auth)</div></div>
  </div>`;
}

/* ── Chart section ── */
function renderChartSection(daily){
  const today = todayStr(), minDate = minDateStr();
  const fromVal = state.customFrom || '', toVal = state.customTo || '';
  return `<div class="section" id="chart-section">
    <div class="section-head">
      <h2>Activity over time</h2>
      <div class="controls">
        <div class="btn-group" id="tf-group">
          <button onclick="setDays(1)"  class="${!state.customFrom&&state.days===1?'active':''}">1d</button>
          <button onclick="setDays(7)"  class="${!state.customFrom&&state.days===7?'active':''}">7d</button>
          <button onclick="setDays(14)" class="${!state.customFrom&&state.days===14?'active':''}">14d</button>
          <button onclick="setDays(30)" class="${!state.customFrom&&state.days===30?'active':''}">30d</button>
          <button onclick="setDays(60)" class="${!state.customFrom&&state.days===60?'active':''}">60d</button>
          <button onclick="setDays(90)" class="${!state.customFrom&&state.days===90?'active':''}">90d</button>
        </div>
        <div class="date-range${state.customFrom?' active':''}" title="Custom date range">
          <input type="date" id="dr-from" value="${fromVal}" min="${minDate}" max="${today}"
            onchange="setCustomRange(this.value, document.getElementById('dr-to').value)"/>
          <span>→</span>
          <input type="date" id="dr-to" value="${toVal}" min="${minDate}" max="${today}"
            onchange="setCustomRange(document.getElementById('dr-from').value, this.value)"/>
        </div>
        <div class="btn-group" id="ct-group">
          <button onclick="setChartType('bar')"  class="${state.chartType==='bar'?'active':''}">Bar</button>
          <button onclick="setChartType('line')" class="${state.chartType==='line'?'active':''}">Line</button>
        </div>
      </div>
    </div>
    <div id="chart-inner">${drawChart(daily)}</div>
  </div>`;
}

function drawChart(daily){
  return state.chartType==='line' ? drawLine(daily) : drawBars(daily);
}

function drawBars(daily){
  const dates = getDates();
  const active = KEY_EVENTS.filter(ev=>!state.hiddenEvents.has(ev));
  const H = 160;
  const maxVal = Math.max(...dates.flatMap(d=>active.map(ev=>daily[d]?.[ev]||0)), 1);

  const bars = dates.map(date=>{
    const day = daily[date]||{};
    const evBars = active.map(ev=>{
      const h = day[ev] ? Math.max(2, Math.round((day[ev]/maxVal)*H)) : 0;
      return h > 0
        ? `<div style="flex:1;height:${h}px;background:${color(ev)};border-radius:2px 2px 0 0;min-width:2px" title="${ev}: ${day[ev]}"></div>`
        : `<div style="flex:1;min-width:2px"></div>`;
    }).join('');
    return `<div class="bar-day" style="height:${H}px;display:flex;align-items:flex-end;gap:1px">${evBars}</div>`;
  }).join('');

  const labels = dates.map(date=>`<div class="chart-xlabel">${date.slice(5)}</div>`).join('');

  return `<div class="chart-area">
    <div class="chart">${bars}</div>
    <div class="chart-xlabels">${labels}</div>
  </div>${renderLegend()}`;
}

function drawLine(daily){
  const dates=getDates();
  const active=KEY_EVENTS.filter(ev=>!state.hiddenEvents.has(ev));
  const allVals=dates.flatMap(d=>active.map(ev=>daily[d]?.[ev]||0));
  const totalEvents=allVals.reduce((a,b)=>a+b,0);
  const maxVal=Math.max(...allVals,1);
  const W=1000, H=160, n=dates.length;

  if(totalEvents===0){
    return `<div class="line-chart-wrap" style="display:flex;align-items:center;justify-content:center">
      <span style="font-size:12px;color:var(--ink3);font-family:var(--mono)">No activity in this period</span>
    </div>${renderLegend()}`;
  }

  const elements=active.map(ev=>{
    const pts=dates.map((date,i)=>({
      x: n>1 ? Math.round(i/(n-1)*W) : W/2,
      y: Math.round(H-((daily[date]?.[ev]||0)/maxVal)*(H-8)),
      v: daily[date]?.[ev]||0
    }));
    if(n===1){
      // Single date: render a dot
      return pts[0].v>0
        ? `<circle cx="${pts[0].x}" cy="${pts[0].y}" r="6" fill="${color(ev)}"/>`
        : '';
    }
    const pointStr=pts.map(p=>p.x+','+p.y).join(' ');
    return `<polyline points="${pointStr}" fill="none" stroke="${color(ev)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>`;
  }).join('');

  const step=Math.max(1,Math.floor(n/6));
  const labels=dates.filter((_,i)=>i===0||i===n-1||i%step===0).map(date=>{
    const i=dates.indexOf(date);
    const x=n>1?Math.round(i/(n-1)*W):W/2;
    return `<text x="${x}" y="${H+18}" text-anchor="middle" font-size="12" fill="#9ca3af" font-family="monospace">${date.slice(5)}</text>`;
  }).join('');

  return `<div class="line-chart-wrap">
    <svg viewBox="0 0 ${W} ${H+24}" preserveAspectRatio="none">${elements}${labels}</svg>
  </div>${renderLegend()}`;
}

function renderLegend(){
  return `<div class="chart-legend">
    ${KEY_EVENTS.map(ev=>`
    <div class="legend-item" onclick="toggleEvent('${ev}')" style="opacity:${state.hiddenEvents.has(ev)?'.3':'1'}">
      <div class="legend-dot" style="background:${color(ev)}"></div>${ev.replace(/_/g,' ')}
    </div>`).join('')}
  </div>`;
}

/* ── Summary ── */
function renderSummary(data){
  const dates = getDates();
  const daily = data.daily||{};
  const dp    = data.deep||{};
  const s     = data.stores||{};
  const f     = data.funnel||{};

  // Aggregate totals for the selected period
  const totals={};
  dates.forEach(date=>{
    Object.entries(daily[date]||{}).forEach(([ev,n])=>{ totals[ev]=(totals[ev]||0)+n; });
  });
  const totalEvents=Object.values(totals).reduce((a,b)=>a+b,0);

  if(totalEvents===0 && dates.length<=1){
    return `<div class="summary"><div class="summary-title">✦ Period summary</div>
      <div class="summary-body"><span class="neutral">No activity recorded in this period.</span></div></div>`;
  }

  const parts=[];

  // Period label
  const periodLabel = state.customFrom
    ? `From ${state.customFrom} to ${state.customTo||todayStr()}`
    : state.days===1 ? 'Today' : `Last ${state.days} days`;

  // Activity volume
  if(totalEvents>0){
    const topEv=Object.entries(totals).sort((a,b)=>b[1]-a[1])[0];
    parts.push(`<strong>${periodLabel}</strong>: <strong>${totalEvents.toLocaleString()}</strong> total events.`
      + (topEv ? ` Most frequent: <strong>${topEv[0].replace(/_/g,' ')}</strong> (${topEv[1].toLocaleString()}).` : ''));
  }

  // Best day
  if(dates.length>1){
    const dayTotals=dates.map(date=>({date,n:Object.values(daily[date]||{}).reduce((a,b)=>a+b,0)}));
    const best=dayTotals.sort((a,b)=>b.n-a.n)[0];
    if(best&&best.n>0) parts.push(`Best day: <strong>${best.date}</strong> with ${best.n} events.`);
  }

  // Trend (compare first half vs second half)
  if(dates.length>=4){
    const half=Math.floor(dates.length/2);
    const first=dates.slice(0,half).reduce((s,d)=>s+Object.values(daily[d]||{}).reduce((a,b)=>a+b,0),0);
    const second=dates.slice(half).reduce((s,d)=>s+Object.values(daily[d]||{}).reduce((a,b)=>a+b,0),0);
    if(first>0){
      const change=Math.round((second-first)/first*100);
      if(change>=10) parts.push(`Trend: <span class="good">↑ +${change}% vs first half.</span>`);
      else if(change<=-10) parts.push(`Trend: <span class="warn">↓ ${change}% vs first half.</span>`);
      else parts.push(`Trend: <span class="neutral">→ stable (${change>0?'+':''}${change}% vs first half).</span>`);
    }
  }

  // Saves in period
  if(totals.save){
    const savesPerDay=(totals.save/dates.length).toFixed(1);
    parts.push(`<strong>${totals.save}</strong> save${totals.save!==1?'s':''} in period (~${savesPerDay}/day).`);
  }

  // Activation rate (all-time)
  if(dp.activation_rate!=null){
    const rate=dp.activation_rate;
    const cls=rate>=60?'good':rate>=30?'neutral':'warn';
    const label=rate>=60?'strong':rate>=30?'moderate':'low';
    parts.push(`All-time activation rate: <span class="${cls}">${rate}% (${label})</span>.`
      +` ${s.total} stores connected, ${f.saved||0} pushed at least once.`);
  }

  // Bulk usage signal
  if(totals.bulk_action && totals.connect){
    const bulkRatio=Math.round(totals.bulk_action/totals.connect*100);
    if(bulkRatio>=50) parts.push(`<span class="good">Bulk actions are widely used</span> — ${totals.bulk_action} bulk ops vs ${totals.connect} connect events in this period.`);
  }

  // Save success rate
  if(totals.save_attempt && totals.save){
    const successRate=Math.round(totals.save/totals.save_attempt*100);
    const cls=successRate>=90?'good':successRate>=70?'neutral':'warn';
    parts.push(`Save success rate: <span class="${cls}">${successRate}%</span> (${totals.save} completed / ${totals.save_attempt} attempted).`);
  }

  // Schedule reliability
  const runsOk=(totals.schedule_run||0), runsFail=(totals.schedule_fail||0), runsPartial=(totals.schedule_partial||0);
  if(runsOk+runsFail+runsPartial>0){
    const total=runsOk+runsFail+runsPartial;
    const reliability=Math.round(runsOk/total*100);
    const cls=reliability>=95?'good':reliability>=80?'neutral':'bad';
    parts.push(`Schedule reliability: <span class="${cls}">${reliability}%</span> (${runsOk} ok, ${runsPartial} partial, ${runsFail} failed out of ${total} runs).`);
  }

  // Scheduling adoption signal
  if(f.scheduled>0){
    const schedPct=Math.round(f.scheduled/f.connected*100);
    parts.push(`${f.scheduled} store${f.scheduled!==1?'s':''} used scheduling (${schedPct}% of connected).`);
  } else if(dp.total_saves>0){
    parts.push(`<span class="neutral">No schedules created yet.</span> Scheduling is a Pro upsell opportunity.`);
  }

  // Return session signal
  if(totals.app_open && totals.connect){
    const returnRatio=(totals.app_open/totals.connect).toFixed(1);
    parts.push(`Return sessions: <strong>${totals.app_open}</strong> app opens vs ${totals.connect} connects (~${returnRatio}x per connected store).`);
  }

  return `<div class="summary">
    <div class="summary-title">✦ Auto summary</div>
    <div class="summary-body">${parts.map(p=>`<p style="margin-bottom:6px">${p}</p>`).join('')}</div>
  </div>`;
}

/* ── Funnel ── */
function renderFunnel(f){
  if(!f) return '';
  const rows=[
    {lbl:'Page views (30d)', n:f.page_views_30d},
    {lbl:'CTA clicks (30d)', n:f.cta_clicks_30d},
    {lbl:'Demo started',     n:f.demoed},
    {lbl:'Store connected',  n:f.connected},
    {lbl:'Pushed to Shopify',n:f.saved},
    {lbl:'Scheduled',        n:f.scheduled},
  ].filter(r=>r.n!=null);
  const max=Math.max(...rows.map(r=>r.n||0),1);
  return `<div class="section">
    <div class="section-head"><h2>Conversion funnel</h2><span style="font-size:11px;color:var(--ink3);font-family:var(--mono)">all time</span></div>
    <div class="funnel">${rows.map(r=>`
      <div class="funnel-row">
        <div class="funnel-lbl">${r.lbl}</div>
        <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${Math.round((r.n||0)/max*100)}%"></div></div>
        <div class="funnel-n">${fmt(r.n)}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ── Events table ── */
function renderTraffic(d){
  const refs = d.traffic_refs || [];
  if(!refs.length) return '';
  const total = refs.reduce((s,r)=>s+r.n, 0);
  const bars = refs.map(r=>{
    const pct = Math.round(r.n/total*100);
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <div style="width:160px;font-size:13px;color:var(--ink2);font-weight:500;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.ref}">${r.ref}</div>
      <div style="flex:1;background:var(--border);border-radius:4px;height:8px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:#2563eb;border-radius:4px"></div>
      </div>
      <div style="font-size:13px;color:var(--ink3);width:60px;text-align:right;font-variant-numeric:tabular-nums">${r.n} · ${pct}%</div>
    </div>`;
  }).join('');
  return `<div class="section-label">Traffic sources · page_view · all time (${total} total)</div>
    <div style="background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px 20px">${bars}</div>`;
}

function renderAcquisition(d){
  const sources = d.beta_sources || [];
  if(!sources.length) return '';
  const total = sources.reduce((s,r)=>s+r.n, 0);
  const bars = sources.map(r=>{
    const pct = Math.round(r.n/total*100);
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <div style="width:140px;font-size:13px;color:var(--ink2);font-weight:500;flex-shrink:0">${r.source||'(blank)'}</div>
      <div style="flex:1;background:var(--border);border-radius:4px;height:8px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:var(--green);border-radius:4px"></div>
      </div>
      <div style="font-size:13px;color:var(--ink3);width:60px;text-align:right;font-variant-numeric:tabular-nums">${r.n} · ${pct}%</div>
    </div>`;
  }).join('');
  return `<div class="section-label">Acquisition source · all time (${total} responses)</div>
    <div style="background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px 20px">${bars}</div>`;
}

function renderEvents(events){
  if(!events||!Object.keys(events).length) return '';
  const rows=Object.entries(events).sort((a,b)=>b[1].total-a[1].total).map(([ev,c])=>`
    <tr>
      <td class="td-event"><span style="display:inline-block;background:${color(ev)};width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:middle"></span>${ev}</td>
      <td class="td-num">${fmt(c.total)}</td>
      <td class="td-num td-d7">${fmt(c.d7)}</td>
      <td class="td-num">${fmt(c.d30)}</td>
    </tr>`).join('');
  return `<div class="section">
    <div class="section-head"><h2>Events breakdown</h2></div>
    <div class="table-scroll"><table>
      <thead><tr><th>Event</th><th style="text-align:right">Total</th><th style="text-align:right;color:var(--green)">7d</th><th style="text-align:right">30d</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

/* ── Stores table ── */
async function loadStores(){
  const url=`/api/admin/stores${SECRET?'?secret='+encodeURIComponent(SECRET):''}`;
  const r=await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return (await r.json()).stores||[];
}
function flagEmoji(cc){
  if(!cc||cc==='—') return '';
  try{ return cc.toUpperCase().replace(/./g,c=>String.fromCodePoint(c.charCodeAt(0)+127397))+' '; }catch{ return ''; }
}
function renderStores(stores){
  if(!stores.length) return `<div class="section"><div class="section-head"><h2>Stores</h2></div><p style="font-size:12px;color:var(--ink3);padding:8px 0">No stores yet — country data captured on next connect.</p></div>`;
  const emailsCsv = stores.filter(s=>s.email).map(s=>`${s.name||s.shop},${s.email}`).join('\n');
  state.emailsCsv = emailsCsv;
  const rows=stores.map(s=>`<tr>
    <td style="font-family:var(--mono);font-size:11px;color:var(--ink3)">${s.shop}</td>
    <td style="font-size:12px;font-weight:500">${s.name!==s.shop?s.name:''}</td>
    <td style="font-size:11px;font-family:var(--mono);color:var(--ink3)">${s.email?`<a href="mailto:${s.email}" style="color:var(--green);text-decoration:none">${s.email}</a>`:'—'}</td>
    <td style="font-size:12px">${flagEmoji(s.country_code)}${s.country!=='—'?s.country:s.country_code}</td>
    <td><select onchange="setPlan('${s.shop}',this)" style="font-size:10px;font-family:var(--mono);border:1px solid var(--border);border-radius:6px;padding:2px 6px;background:${s.plan==='beta'||s.plan==='early_access'?'#dcfce7':s.plan==='pro'?'#ede9fe':s.plan==='starter'?'#eff6ff':'#f1f5f9'};color:${s.plan==='beta'||s.plan==='early_access'?'#166534':s.plan==='pro'?'#5b21b6':s.plan==='starter'?'#1d4ed8':'#475569'};cursor:pointer">
      <option value="beta" ${s.plan==='beta'?'selected':''}>beta</option>
      <option value="free" ${s.plan==='free'?'selected':''}>free</option>
      <option value="starter" ${s.plan==='starter'?'selected':''}>growth</option>
      <option value="pro" ${s.plan==='pro'?'selected':''}>pro</option>
    </select></td>
    <td style="text-align:right;font-family:var(--mono);font-size:12px">${fmt(s.saves)}</td>
    <td style="text-align:right;font-family:var(--mono);font-size:12px">${fmt(s.schedules_run)}</td>
    <td style="font-size:11px;color:var(--ink3)">${s.last_seen?new Date(s.last_seen).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'-'}</td>
  </tr>`).join('');
  return `<div class="section">
    <div class="section-head">
      <h2>Stores <span style="font-size:11px;font-weight:400;color:var(--ink3);margin-left:6px">${stores.length} total · ${stores.filter(s=>s.email).length} with email</span></h2>
      ${emailsCsv?`<button onclick="downloadEmailsCsv()" style="font-size:11px;font-family:var(--mono);background:var(--green-bg);border:1px solid rgba(26,92,56,.2);color:var(--green);border-radius:6px;padding:4px 10px;cursor:pointer">↓ Export emails</button>`:''}
    </div>
    <div class="table-scroll"><table style="min-width:700px">
      <thead><tr>
        <th>Domain</th><th>Name</th><th>Email</th><th>Country</th><th>Plan</th>
        <th style="text-align:right">Saves</th><th style="text-align:right">Sched runs</th><th>Last seen</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

async function setPlan(shop, sel){
  const plan = sel.value;
  try {
    const r = await fetch(`/api/admin/set-plan${SECRET?'?secret='+encodeURIComponent(SECRET):''}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({shop, plan})
    });
    const d = await r.json();
    if(!d.ok) { alert('Error: '+d.error); return; }
    sel.style.background = plan==='beta'?'#dcfce7':plan==='pro'?'#ede9fe':plan==='starter'?'#eff6ff':'#f1f5f9';
    sel.style.color = plan==='beta'?'#166534':plan==='pro'?'#5b21b6':plan==='starter'?'#1d4ed8':'#475569';
  } catch(e) { alert('Error: '+e.message); sel.value = sel.dataset.prev||'beta'; }
}

function downloadEmailsCsv(){
  const csv = 'Name,Email\n' + (state.emailsCsv || '');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = `lederly-beta-emails-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

/* ── Controls ── */
function setDays(d){
  state.days=d; state.customFrom=null; state.customTo=null;
  redrawChart();
}
function setCustomRange(from, to){
  if(!from||!to||from>to) return;
  state.customFrom=from; state.customTo=to;
  redrawChart();
}
function setChartType(t){ state.chartType=t; redrawChart(); }
function toggleEvent(ev){
  if(state.hiddenEvents.has(ev)) state.hiddenEvents.delete(ev); else state.hiddenEvents.add(ev);
  redrawChart();
}
function redrawChart(){
  if(!state.data) return;
  const ci=document.getElementById('chart-inner');
  if(ci) ci.innerHTML=drawChart(state.data.daily);
  // Sync button states
  const tf=document.querySelectorAll('#tf-group button');
  [1,7,14,30,60,90].forEach((d,i)=>{ if(tf[i]) tf[i].className=(!state.customFrom&&state.days===d)?'active':''; });
  const ct=document.querySelectorAll('#ct-group button');
  ['bar','line'].forEach((t,i)=>{ if(ct[i]) ct[i].className=state.chartType===t?'active':''; });
  const dr=document.querySelector('.date-range');
  if(dr) dr.className='date-range'+(state.customFrom?' active':'');
  // Re-render summary
  const sum=document.getElementById('summary-wrap');
  if(sum) sum.innerHTML=renderSummary(state.data);
}

/* ── Main render ── */
async function render(){
  const main=document.getElementById('main');
  try {
    const [d, stores]=await Promise.all([load(), loadStores().catch(()=>[])]);
    state.data=d;
    document.getElementById('hdr-ts').textContent='Updated '+new Date().toLocaleTimeString();
    main.innerHTML=
      renderKPIs(d)+
      `<div id="summary-wrap">${renderSummary(d)}</div>`+
      renderChartSection(d.daily)+
      renderFunnel(d.funnel)+
      renderTraffic(d)+
      renderAcquisition(d)+
      renderStores(stores)+
      renderEvents(d.events)+
      `<p class="refresh-note">Mode: ${d.mode||'?'} · Auto-refresh every 60s</p>`;
  } catch(e){
    main.innerHTML=`<div class="error">⚠ ${e.message}</div>`;
  }
}

renderExcludeChips();
render();
setInterval(render,60000);
</script>
</body>
